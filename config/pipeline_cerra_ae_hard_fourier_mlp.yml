parallelize: false
stages:
  - name: cerraHardMlp
    stage: train
    run_id: caea0021
    config_files:
      - config/cerra_autoencoding.yml
      - config/cerra_ae_cellqueries.yml
      - config/cerra_ae_basic_global_fourier.yml
      - config/cerra_ae_hard_fourier_mlp.yml
    nodes: 1
    chain_jobs: 1
    cleanup_scripts: false
    slurm_args:
      - --ntasks=1
      - --ntasks-per-node=1
      - --cpus-per-task=8
      - --gres=gpu:1
      - --mem=64G
      - --exclusive=user
      - --partition=debug
      - --time=00:30:00
      - --uenv-passthrough=ignore
