# Native WeatherGenerator baseline; merged over config/default_config.yml.
# Reference: rradev/cerra_decode_split:config/forecasting_cerra_3h.yml.
streams_directory: ./config/streams/cerra_autoencoding/
embed_orientation: channels
embed_unembed_mode: full
embed_dropout_rate: 0.0

healpix_level: 5
ae_local_dim_embed: 128
ae_local_num_blocks: 0
ae_local_num_heads: 4
ae_local_dropout_rate: 0.0
ae_local_num_queries: 1
ae_local_queries_per_cell: false
ae_local_max_tokens_per_cell: 256
ae_adapter_num_heads: 4
ae_adapter_embed: 32
ae_adapter_dropout_rate: 0.0
ae_global_dim_embed: 128
ae_global_num_blocks: 0
ae_global_num_heads: 4
ae_global_dropout_rate: 0.0
ae_global_trailing_layer_norm: false
ae_aggregation_num_blocks: 0
ae_aggregation_num_heads: 4
ae_aggregation_dropout_rate: 0.0

# Existing WeatherGenerator BilinearDecoder; not an alternative autoencoder.
decoder_type: Linear
pred_self_attention: false
pred_mlp_adaln: false
num_class_tokens: 0
num_register_tokens: 0
fe_num_blocks: 0
fe_dropout_rate: 0.0
fe_impute_latent_noise_std: 0.0
with_fsdp: false
compile_model: false

zarr_store: zarr
train_logging:
  terminal: 10
  metrics: 10
  checkpoint: 100

data_loading:
  num_workers: 8
  repeat_data_in_mini_epoch: true
  memory_pinning: false

training_config:
  training_mode: [masking]
  num_mini_epochs: 10
  samples_per_mini_epoch: 256
  shuffle: false
  # Index 1 is the only sample permitted by the native sampler in this window.
  start_date: 1984-12-31T21:00
  end_date: 1985-01-01T03:00
  time_window_step: "03:00:00"
  time_window_len: "03:00:00"
  learning_rate_scheduling:
    lr_start: 0.001
    lr_max: 0.001
    lr_final_decay: 0.001
    lr_final: 0.001
    num_steps_warmup: 2
    num_steps_cooldown: 1
    policy_warmup: linear
    policy_decay: constant
    policy_cooldown: linear
    parallel_scaling_policy: const
  optimizer:
    grad_clip: 1.0
    weight_decay: 0.0
    grad_scaling: false
    adamw:
      beta1: 0.9
      beta2: 0.999
      eps: 1.0e-8
  model_input:
    forecasting:
      num_samples: 1
      num_steps_input: 1
      masking_strategy: forecast
  forecast:
    time_step: "03:00:00"
    offset: 0
    num_steps: 0
    policy: fixed

validation_config:
  start_date: 1984-12-31T21:00
  end_date: 1985-01-01T03:00
  samples_per_mini_epoch: 1
  shuffle: false
  validate_with_ema:
    enabled: false
  validate_before_training: true
  output:
    num_samples: 1
    normalized_samples: false
    streams: [CERRA]

test_config:
  start_date: 1984-12-31T21:00
  end_date: 1985-01-01T03:00
  samples_per_mini_epoch: 1
  shuffle: false
  output:
    num_samples: 1
    normalized_samples: false
    streams: [CERRA]

wgtags:
  exp: cerra_ae_coord_mlp
