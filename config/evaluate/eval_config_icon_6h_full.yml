# Field plots for full-grid ICON 6h inference (AE 639zhq8b and forecaster klet59g5).
# Colour limits use the 1st/99th percentiles (range_percentile) instead of min/max so a few
# outliers do not wash out the maps; sequential colormaps for fields, RdBu_r for bias.
global_plotting_options:
  image_format: "png"
  animation_format: "gif"
  dpi_val: 150
  fps: 2
  ICON:
    marker_size: 2.0
    range_percentile: 1.0
    bias_colormap: "RdBu_r"
    q_850:
      colormap: "YlGnBu"
    10u:
      colormap: "Spectral_r"

evaluation:
  metrics: ["rmse", "mae"]
  score_plots: [metric_plots]
  summary_dir: "./plots/"
  plot_ensemble: false
  print_summary: true

default_streams:
  ICON:
    regions: ["icon"]
    channels: ["q_850", "10u"]
    evaluation:
      forecast_step: "all"
      sample: "all"
    plotting:
      sample: [0, 1]
      forecast_step: "all"
      data_plots:
        - maps:
            predictions: [image, video]
            target: [image]
            bias: [image]
