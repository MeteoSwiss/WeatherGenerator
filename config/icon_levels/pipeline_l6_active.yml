      - "--time=12:00:00"

  - name: fc6a
    stage: train
    run_id: mxy7ypl7
    config_files:
      - config/icon_levels/runs/fc6a_mxy7ypl7.yml
    chain_jobs: 3
    nodes: 8
    slurm_args:
      - "--time=12:00:00"
