# Simplified from rradev/cerra_decode_split:config/streams/cerra_r850_z500/cerra.yml.
CERRA:
  type: anemoi
  anemoi_config:
    dataset: cerra-rr-an-oper-se-al-ec-mars-5p5km-1985-2023-3h-v2
    # Native rows/columns [267:801]: one contiguous 534 x 534 block.
    trim_edge: [267, 268, 267, 268]
  stream_id: 0
  frequency: "03:00:00"
  source: [r_850, z_500]
  target: [r_850, z_500]
  geoinfo_channels: []
  loss_weight: 1.0
  token_size: 32
  max_num_targets: -1
  shuffle_source: false
  shuffle_target: false
  embed:
    net: linear
    num_tokens: 1
    num_heads: 4
    dim_embed: 128
    num_blocks: 0
  embed_target_coords:
    net: linear
    dim_embed: 128
  target_readout:
    type: obs_value
    num_layers: 1
    num_heads: 4
  pred_head:
    ens_size: 1
    num_layers: 1
