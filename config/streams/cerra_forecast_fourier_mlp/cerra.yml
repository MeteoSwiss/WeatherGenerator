# Joint r_850/z_500 stream from rradev/cerra_decode_split, with Fourier coordinate MLP.
CERRA:
  type: anemoi
  anemoi_config:
    dataset: cerra-rr-an-oper-se-al-ec-mars-5p5km-1985-2023-3h-v2
    trim_edge: 100
  stream_id: 0
  frequency: "03:00:00"
  source: ['skt', 'sp', '10si', '10wdir', '2r', '2t', 'msl', 'r_100', 'r_1000', 'r_150', 'r_200', 'r_250', 'r_300', 'r_400', 'r_50', 'r_500', 'r_600', 'r_700', 'r_850', 'r_925', 't_100', 't_1000', 't_150', 't_200', 't_250', 't_300', 't_400', 't_50', 't_500', 't_600', 't_700', 't_850', 't_925', 'u_100', 'u_1000', 'u_150', 'u_200', 'u_250', 'u_300', 'u_400', 'u_50', 'u_500', 'u_600', 'u_700', 'u_850', 'u_925', 'v_100', 'v_1000', 'v_150', 'v_200', 'v_250', 'v_300', 'v_400', 'v_50', 'v_500', 'v_600', 'v_700', 'v_850', 'v_925', 'z_100', 'z_1000', 'z_150', 'z_200', 'z_250', 'z_300', 'z_400', 'z_50', 'z_500', 'z_600', 'z_700', 'z_850', 'z_925']
  target: [r_850, z_500]
  geoinfo_channels: [insolation, cos_local_time, sin_local_time, cos_julian_day, sin_julian_day, cos_latitude, cos_longitude, sin_latitude, sin_longitude]
  loss_weight: 1.0
  token_size: 32
  max_num_targets: 375000
  embed:
    net: transformer
    num_tokens: 1
    num_heads: 8
    dim_embed: 256
    num_blocks: 2
  embed_target_coords:
    net: mlp
    dim_embed: 256
    hidden_factor: 8
    # Same frequencies as the successful autoencoder; nine geoinfo channels give 114 inputs.
    fourier_frequencies: [16.0, 22.627416997969522, 32.0, 45.254833995939045, 64.0, 90.50966799187809, 128.0, 181.01933598375618, 256.0, 362.03867196751236, 512.0, 724.0773439350247, 1024.0, 1448.1546878700494, 2048.0, 2896.309375740099]
  target_readout:
    type: obs_value
    num_layers: 2
    num_heads: 4
  pred_head:
    ens_size: 1
    num_layers: 1
