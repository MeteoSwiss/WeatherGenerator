CERRA :
  healpix_level: 7
  healpix_active_region:
    from_data: true
    rings: 0
  type : anemoi
  filenames : ['cerra-rr-an-oper-se-al-ec-mars-5p5km-1985-2023-3h-v2.zarr']
  frequency : 3h
  stream_id : 1
  source_exclude : ['skt','tciwv','tp','al','rsn','sde','sf']
  #source: []
  target_exclude : ['tciwv','tp','al','rsn','sde','sf']
  geoinfo_channels : ['orog', 'lsm']
  diagnostic: False
  loss_weight : 1.
  location_weight : cosine_latitude
  masking_rate : 0.6
  masking_rate_none : 0.05
  token_size : 64
  tokenize_spacetime : True
  # grid_conv scatters the predictions onto CERRA's own 1069x1069 raster, and an empty pixel
  # is indistinguishable from a genuine zero to the convolutions. Capping the targets would
  # leave the raster half empty in training and full at inference, so this stream predicts the
  # whole grid, matching era5_o96_cerra_3h_inf.
  #max_num_targets: 570000
  max_num_targets: -1
  embed : 
    net : transformer
    num_tokens : 1
    num_heads : 8
    dim_embed : 512
    num_blocks : 2
  embed_target_coords :
    net : linear
    dim_embed : 512
  target_readout :
    num_layers : 2
    num_heads : 4
  pred_head :
    ens_size : 1
    num_layers : 1
