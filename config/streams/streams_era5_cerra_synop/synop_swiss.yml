SynopSwissmetnet :
  type : anemoi
  filenames : ['synop-dwh-sparse-swissmetnet-2015-2020-10m-v1.zarr']
  loss_weight : 1.0
  source_exclude : []
  target_exclude : []
  masking_rate : 0.6
  masking_rate_none : 0.05
  token_size : 64
  tokenize_spacetime : True
  max_num_targets: -1
  embed : 
    net : transformer
    num_tokens : 1
    num_heads : 2
    dim_embed : 128
    num_blocks : 2
  embed_target_coords : 
    net : linear
    dim_embed : 128
  target_readout :
    type : 'obs_value'  # token or obs_value
    num_layers : 2
    num_heads : 4
  pred_head : 
    ens_size : 1
    num_layers : 1