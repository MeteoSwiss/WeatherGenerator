ICON :
  type : anemoi
  filenames : ['/capstor/store/mch/msopr/ml/datasets/mch-realch1-fdb-1km-2005-2025-1h-pl13-v1.0.zarr']
  frequency : 1h
  stream_id : 0
  source : ['QV_850']
  target : ['QV_850']
  # no geo info geoinfo_channels : ['FR_LAND', 'FIS', 'SSO_STDH', 'SSO_SIGMA', 'SSO_GAMMA', 'SSO_THETA', 'insolation', 'SOILTYP'] 
  loss_weight : 1.
  #location_weight : cosine_latitude
