    dim_embed : 256
    num_blocks : 2
  embed_target_coords :
    net : linear
    dim_embed : 256
  target_readout :
    num_layers : 2
    num_heads : 4
    # sampling_rate : 0.5
  pred_head :
    ens_size : 1
    num_layers : 1
  channel_weights :
    QV_850: 1