  stream_id : 1
  source_exclude : ['TOT_PREC_1H', 'TOT_PREC_6H', 'CAPE_ML', 'CAPE_MU', 'CIN_ML', 'CIN_MU', 'CLCH', 'CLCL', 'CLCM', 'CLCT', 'OMEGA_50', 'OMEGA_100', 'OMEGA_150', 'OMEGA_200', 'OMEGA_250', 'OMEGA_300', 'OMEGA_400', 'OMEGA_500', 'OMEGA_600', 'OMEGA_700', 'OMEGA_850', 'OMEGA_925', 'OMEGA_1000', 'LPI', 'PLCOV', 'SKC', 'SKT', 'W_SO']
