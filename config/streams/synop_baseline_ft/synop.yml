# Synop stream for the single-encoder baseline finetune (parent: mewoukj1).
#
# Branch note: this is the tsivam/dev/cerra-pipeline codebase, which has a single global
# encoder and NO active-region machinery -- no healpix_grid.py, no regions.py, and nothing
# reads healpix_active_region. healpix_level is global only (cf.healpix_level, read in
# multi_stream_data_sampler.py:108), so a per-stream level would be ignored.
#
# Consequently synop CANNOT be restricted to the CERRA footprint here; it is global.
# The multiHP variants (synop_cerra_ft) are trimmed to CERRA, so the baseline trains on
# strictly more stations. That asymmetry has to be either removed (port the region code to
# this branch) or stated explicitly when comparing against the multiHP runs.
#
# obs_types
# 0 : polar orbiting satellites
# 1 : geostationay satellites
# 2 : conventional observations

SurfaceCombined :
  type : obs
  stream_id : 2
  filenames : ['observations-ea-ofb-0001-1979-2025-combined-surface-v5.zarr']
  geoinfo_channels : []

  footprint:
    filenames: ['cerra-rr-an-oper-se-al-ec-mars-5p5km-1985-2023-3h-v2.zarr']
    healpix_level: 7
    rings: 1

  loss_weight : 1.0
  masking_rate : 0.6
  masking_rate_none : 0.05
  token_size : 64
  tokenize_spacetime : False
  max_num_targets: -1
  embed :
    net : transformer
    num_tokens : 1
    num_heads : 2
    dim_embed : 256
    num_blocks : 2
  embed_target_coords :
    net : linear
    dim_embed : 256
  target_readout :
    num_layers : 2
    num_heads : 4
  pred_head :
    ens_size : 1
    num_layers : 1
