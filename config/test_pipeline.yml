stages:
  - name: pretrain
    stage: train
    config_files:
      - config/config_forecasting.yml
    options:
      - training_config.num_mini_epochs=1
      - training_config.forecast.num_steps=3
      - training_config.samples_per_mini_epoch=100
      - train_logging.checkpoint=20
    chain_jobs: 1
    nodes: 2
    slurm_args:
      - "--time=12:00:00"

  - name: finetune
    stage: train
    from_run_id: STAGE.pretrain   # optional; use STAGE.<name> to reference a previous stage's run_id
    config_files:
      - config/config_forecasting_finetuning.yml
    options:
      - training_config.num_mini_epochs=1
      - training_config.forecast.num_steps=3
    chain_jobs: 1
    nodes: 2
    slurm_args:
      - "--time=12:00:00"


  - name: inference
    stage: inference
    from_run_id: STAGE.finetune
    options:
      - test_config.start_date=2023-10-01T00:00
      - test_config.end_date=2023-12-31T00:00
      - test_config.samples_per_mini_epoch=1
      - test_config.output.num_samples=1
      - test_config.forecast.num_steps=20
    nodes: 1
    slurm_args:
      - "--time=06:00:00"
  