streams_directory: "./config/streams/synop_baseline_ft/"

freeze_modules: "encoder\\.ae_.*|forecast_engine|q_cells"

general:
  # Fresh LR schedule. mini_epoch_base is derived from istep (trainer.py), so without this
  # a continuation resumes at the parent's step count and trains nothing.
  istep: 0
  rank: ???
  world_size: ???

training_config:
  num_mini_epochs: 16

  learning_rate_scheduling:
    lr_start: 1e-6
    lr_max: 1e-4
    lr_final_decay: 2e-6
    lr_final: 0.0
    num_steps_warmup: 256
    num_steps_cooldown: 512
    policy_warmup: "cosine"
    policy_decay: "cosine"
    policy_cooldown: "linear"
    parallel_scaling_policy: "sqrt"

wgtags:
  exp: "synop_decoder_ft_baseline"
